[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemi-dock"
version = "0.1.0"
description = "Computational drug discovery and cheminformatics engine combining SMILES graph perception, circular fingerprints, message-passing graph neural networks, multitask ADME pharmacokinetics, evolutionary de novo ligand optimization, empirical docking, and PROTAC ternary cooperativity modeling"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "ZengLLQ" },
]
keywords = [
    "drug-discovery",
    "cheminformatics",
    "qsar-modeling",
    "graph-neural-networks",
    "molecular-docking",
    "adme-prediction",
    "de-novo-drug-design",
    "protac",
    "computational-chemistry",
    "scaffold-hopping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "flake8>=7.0",
    "mypy>=1.8",
]

[project.scripts]
alchemi-dock = "alchemi_dock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
