name: AlchemiDock CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Bytecode compilation check
        run: python -m compileall -q src

      - name: Lint check with flake8
        run: flake8 src tests examples --max-line-length=120 --extend-ignore=E203

      - name: Static type check with mypy
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke tests
        run: |
          alchemi-dock --help
          alchemi-dock demo --seed 42
          python -m alchemi_dock.cli profile --smiles "CC(=O)Oc1ccccc1C(=O)O"
          python -m alchemi_dock.cli screen --epochs 12 --seed 42
          python -m alchemi_dock.cli dock --smiles "Cn1cnc2c1c(=O)n(C)c(=O)n2C" --steps 120 --seed 42
          python -m alchemi_dock.cli protac --cooperativity 8.5 --linker-length 10 --seed 42
          python -m alchemi_dock.cli optimize --generations 6 --population 12 --seed 42
          python -m alchemi_dock.cli benchmark --seed 42

      - name: Run standalone examples
        run: |
          python examples/01_molgraph_aromaticity_and_descriptors.py
          python examples/02_gnn_qsar_and_conformal_screening.py
          python examples/03_adme_pk_and_docking_pipeline.py
          python examples/04_protac_ternary_hook_and_degradation.py
          python examples/05_denovo_mcts_pareto_optimization.py
